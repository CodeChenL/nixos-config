name: Build Custom Overlays

# 手动触发 + 周一凌晨跑一次；不在每次 PR 上跑（构建耗时长）
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  build-overlays:
    name: Build overlay packages (${{ matrix.system }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            host: ChenIdeaCentre
            packages: "natfrp-service freedownloadmanager trae-cn github-copilot-cli opencode-desktop pgyvisitor"
          - system: aarch64-linux
            host: ChenRadxaOrionO6N
            packages: "natfrp-service"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v9

      - name: Enable flakes and QEMU binfmt
        run: |
          mkdir -p ~/.config/nix
          cat > ~/.config/nix/nix.conf <<EOF
          experimental-features = nix-command flakes
          extra-platforms = aarch64-linux
          accept-flake-config = true
          EOF

      - name: Build overlay packages
        run: |
          set -e
          for pkg in ${{ matrix.packages }}; do
            echo "=== Building ${pkg} ==="
            nix build \
              --no-link \
              ".#nixosConfigurations.${{ matrix.host }}.pkgs.${pkg}"
          done
